openapi: 3.0.3

info:
  title: link-shortener
  version: 1.0.0
  description: Сервис коротких ссылок
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /

security: []

paths:
  /links:
    post:
      operationId: createLink
      summary: Создать короткую ссылку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: Ссылка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLinkResponse"
        "400":
          description: Неверное тело запроса, адрес, лимит переходов или срок жизни
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                invalidUrl:
                  value:
                    error: url must be a valid http or https address
                invalidMaxClicks:
                  value:
                    error: max_clicks must be positive
                invalidExpiresAt:
                  value:
                    error: expires_at must be in the future
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /{code}:
    get:
      operationId: openLink
      summary: Перейти по короткой ссылке
      description: Засчитывает переход и перенаправляет на исходный адрес
      parameters:
        - name: code
          in: path
          required: true
          description: Код короткой ссылки
          schema:
            type: string
            example: 5aVcEpZ
      responses:
        "302":
          description: Перенаправление на исходный адрес
          headers:
            Location:
              description: Исходный адрес
              schema:
                type: string
                format: uri
        "404":
          description: Ссылки нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: link not found
        "410":
          description: Ссылка была, но лимит переходов исчерпан или срок жизни закончился
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: link is no longer available
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    CreateLinkRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Исходный адрес со схемой http:// или https://
          example: https://example.com/page
        max_clicks:
          type: integer
          format: int64
          minimum: 1
          description: Максимальное число переходов, без поля переходы не ограничены
          example: 5
        expires_at:
          type: string
          format: date-time
          description: Момент окончания срока жизни, должен быть в будущем
          example: "2030-01-02T03:04:05Z"

    CreateLinkResponse:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Код короткой ссылки
          example: 5aVcEpZ

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
