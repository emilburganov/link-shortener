<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cg transform='translate(8 8) scale(0.667)' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/%3E%3Cpath d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>{{.Heading}}</title>
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --line: #f1f5f9;
        --brand: #0d9488;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background: #ffffff;
        font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.8);
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 72rem;
        height: 64px;
        margin: 0 auto;
        padding: 0 24px;
      }

      .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--brand);
      }

      .name {
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.025em;
      }

      main {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 48px 24px 96px;
        overflow: hidden;
        text-align: center;
      }

      main::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(13, 148, 136, 0.07) 1.5px, transparent 1.5px);
        background-size: 28px 28px;
        opacity: 0.4;
      }

      main::after {
        content: '';
        position: absolute;
        inset: 0 0 auto;
        height: 20rem;
        background: linear-gradient(to bottom, rgba(240, 253, 250, 0.6), transparent);
      }

      main > * {
        position: relative;
        z-index: 1;
      }

      .code {
        color: var(--brand);
        font-size: clamp(5rem, 22vw, 9rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      p {
        max-width: 32rem;
        margin: 0;
        color: var(--muted);
        font-size: 1.125rem;
        line-height: 1.625;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="mark" aria-hidden="true">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          </svg>
        </div>
        <span class="name">link-shortener</span>
      </div>
    </header>

    <main>
      <div class="code" aria-hidden="true">{{.Status}}</div>
      <h1>{{.Heading}}</h1>
      <p>{{.Text}}</p>
    </main>
  </body>
</html>
